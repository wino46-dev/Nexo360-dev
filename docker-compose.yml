services:
  app:
    build:      
      args:
        user: sammy
        uid: 1000
      context: ./
      dockerfile: Dockerfile    
    image: sh360-app
    tty: true
    container_name: sh360-app
    restart: always
    working_dir: /var/www/
    volumes:
      - ./:/var/www    
    networks:
      - sh360-red

  nginx:
    image: nginx:alpine
    tty: true
    container_name: sh360-nginx
    restart: always
    ports:
      - 8701:80
    volumes:
      - ./:/var/www
      - ./docker-compose/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - sh360-red

  php:
    image: php:7.0-fpm
    container_name: php-container
    expose:
      - 9000
    volumes:
      - ./www/html/:/var/www/html/
    networks:
      - sh360-red

  mysql:
    image: mysql:5.7
    container_name: mysql-container
    volumes_from:
      - mysql-data
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: mydb
      MYSQL_USER: myuser
      MYSQL_PASSWORD: password
    networks:
      - sh360-red

  mysql-data:
    image: mysql:5.7
    container_name: mysql-data-container
    volumes:
      - /var/lib/mysql
    command: "true"

   
networks:
  sh360-red:
    driver: bridge