services:
  mariadb:
    image: docker.io/bitnami/mariadb@sha256:080f43016353de960fbdc733f7f149fae8316382af4c479a4a8adab369861909
    container_name: sh360-mysql
    ports:
      - 3306:3306
    environment:
      MARIADB_USER: "sh360_dev"
      MARIADB_PASSWORD: "Throng-Predict9-Wobbly"
      MARIADB_DATABASE: "sh360_dev"
      MARIADB_ROOT_PASSWORD: "secret"
    networks:
      sh360-red:
        aliases:
          - sh360-mysql

  app:
    build:
      args:
        user: sammy
        uid: 1000
      context: ./
      dockerfile: Dockerfile
    image: sh360-app
    expose:
      - 9000
    environment:
      DB_CONNECTION: mysql
      DB_HOST: sh360-mysql
      DB_PORT: 3306
      DB_DATABASE: sh360_dev
      DB_USERNAME: sh360_dev
      DB_PASSWORD: Throng-Predict9-Wobbly
    depends_on:
      - mariadb
    command: >
      sh -lc "mkdir -p /var/www/storage/logs /var/www/bootstrap/cache && chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache && chmod -R ug+rwX /var/www/storage /var/www/bootstrap/cache && exec php-fpm -F"
    tty: true
    container_name: sh360-app
    restart: always
    working_dir: /var/www/
    volumes:
      - ./:/var/www    
    networks:
      - sh360-red

  nginx:
    image: nginx:alpine
    tty: true
    container_name: sh360-nginx
    restart: always
    ports:
      - 8701:80
    volumes:
      - ./:/var/www
      - ./docker-compose/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - sh360-red

  jenkins:
    image: jenkins/jenkins:lts
    privileged: true
    user: root
    ports:
      - 8080:8080
      - 50000:50000
    container_name: jenkins
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

networks:
  sh360-red:
    driver: bridge

volumes:
  jenkins_home: