version: "3.7"
services:
  app:
    build:      
      args:
        user: sammy
        uid: 1000
      context: ./
      dockerfile: Dockerfile    
    image: sh360-app
    tty: true
    container_name: sh360-app
    restart: always
    working_dir: /var/www/
    volumes:
      - ./:/var/www    
    networks:
      - sh360-red
  
  nginx:
    image: nginx:alpine
    tty: true
    container_name: sh360-nginx
    restart: always
    ports:
      - 8701:80
    volumes:
      - ./:/var/www
      - ./docker-compose/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - sh360-red

networks:
  sh360-red:
    driver: bridge