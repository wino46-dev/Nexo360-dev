openapi: 3.0.3
info:
  title: Local PMS API
  version: 1.0.0
  description: |
    API para gestionar reservas, huéspedes, inventario y catálogos en el PMS Local.
    Multi-tenant por `hotel_code` y autenticación por `X-API-KEY`.
servers:
  - url: https://api.tu-dominio.com
security:
  - ApiKeyAuth: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-KEY
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, additionalProperties: true }
    Pagination:
      type: object
      properties:
        page: { type: integer, minimum: 1, default: 1 }
        per_page: { type: integer, minimum: 1, maximum: 200, default: 25 }
        total: { type: integer }
    Customer:
      type: object
      properties:
        name: { type: string }
        surname: { type: string }
        email: { type: string, format: email }
        phone: { type: string }
        language: { type: string, example: es }
    Concept:
      type: object
      properties:
        name: { type: string }
        total_price: { type: number, format: float }
        type: { type: integer }
    BookingRoom:
      type: object
      required: [room_type_id, checkin, checkout, adults]
      properties:
        reservation_id: { type: integer, readOnly: true }
        room_type_id: { type: integer }
        room_id: { type: integer, nullable: true }
        checkin: { type: string, format: date }
        checkout: { type: string, format: date }
        adults: { type: integer }
        children: { type: integer, default: 0 }
        price: { type: number, format: float }
        notes: { type: string }
        state: { type: string, enum: [pending, confirmed, cancelled, no_show, checked_in, checked_out] }
    Booking:
      type: object
      properties:
        booking_id: { type: string }
        external_locator: { type: string, nullable: true }
        external_source: { type: string, nullable: true }
        state: { type: string, enum: [pending, confirmed, cancelled] }
        total_price: { type: number, format: float }
        currency: { type: string, default: EUR }
        customer: { $ref: '#/components/schemas/Customer' }
        rooms:
          type: array
          items: { $ref: '#/components/schemas/BookingRoom' }
        concepts:
          type: array
          items: { $ref: '#/components/schemas/Concept' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Guest:
      type: object
      required: [reservation_id, firstname, lastname, documentType, documentNumber]
      properties:
        guest_id: { type: integer, readOnly: true }
        external_guest_id: { type: string }
        reservation_id: { type: integer }
        firstname: { type: string }
        lastname: { type: string }
        lastname2: { type: string }
        email: { type: string, format: email }
        mobile: { type: string }
        relationship: { type: string }
        documentType: { type: string }
        documentNumber: { type: string }
        documentSupportNumber: { type: string }
        documentExpeditionDate: { type: string, format: date }
        documentCountryId: { type: string }
        gender: { type: string, enum: [male, female, other] }
        birthdate: { type: string, format: date }
        residenceStreet: { type: string }
        zip: { type: string }
        residenceCity: { type: string }
        nationality: { type: string }
        countryId: { type: string }
        countryName: { type: string }
        countryState: { type: string }
        countryStateName: { type: string }
        responsibleCheckinPartnerId: { type: string }
        checkinPartnerState: { type: string, enum: [pending, onboard, signed] }
        signature: { type: string, nullable: true }
paths:
  /api/v1/local-pms/{hotel_code}/bookings:
    get:
      summary: Buscar/listar reservas
      parameters:
        - in: path
          name: hotel_code
          required: true
          schema: { type: string }
        - in: query
          name: email
          schema: { type: string }
        - in: query
          name: external_locator
          schema: { type: string }
        - in: query
          name: arrival_start
          schema: { type: string, format: date }
        - in: query
          name: arrival_end
          schema: { type: string, format: date }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: per_page
          schema: { type: integer, default: 25 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Booking' }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        '401': { description: Unauthorized, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    post:
      summary: Crear reserva (folio con habitaciones)
      parameters:
        - in: path
          name: hotel_code
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer, rooms]
              properties:
                external_locator: { type: string }
                external_source: { type: string }
                customer: { $ref: '#/components/schemas/Customer' }
                rooms:
                  type: array
                  items: { $ref: '#/components/schemas/BookingRoom' }
                concepts:
                  type: array
                  items: { $ref: '#/components/schemas/Concept' }
      responses:
        '201': { description: Creado, content: { application/json: { schema: { $ref: '#/components/schemas/Booking' } } } }
        '409': { description: Conflicto (duplicado por external_locator) }
        '422': { description: Error de validación }
        '401': { description: Unauthorized }
  /api/v1/local-pms/{hotel_code}/bookings/{booking_id}:
    get:
      summary: Detalle de reserva
      parameters:
        - in: path
          name: hotel_code
          required: true
          schema: { type: string }
        - in: path
          name: booking_id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Booking' } } } }
        '404': { description: No encontrado }
        '401': { description: Unauthorized }
    patch:
      summary: Modificar datos del folio
      parameters:
        - in: path
          name: hotel_code
          required: true
          schema: { type: string }
        - in: path
          name: booking_id
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                customer: { $ref: '#/components/schemas/Customer' }
                concepts:
                  type: array
                  items: { $ref: '#/components/schemas/Concept' }
                state: { type: string, enum: [pending, confirmed, cancelled] }
      responses:
        '200': { description: OK }
        '401': { description: Unauthorized }
        '404': { description: No encontrado }
    delete:
      summary: Cancelar la reserva
      parameters:
        - in: path
          name: hotel_code
          required: true
          schema: { type: string }
        - in: path
          name: booking_id
          required: true
          schema: { type: string }
      responses:
        '204': { description: Cancelado }
        '401': { description: Unauthorized }
        '404': { description: No encontrado }
  /api/v1/local-pms/{hotel_code}/bookings/{booking_id}/rooms:
    post:
      summary: Añadir habitación a un folio
      parameters:
        - in: path
          name: hotel_code
          required: true
          schema: { type: string }
        - in: path
          name: booking_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingRoom' }
      responses:
        '201': { description: Creado, content: { application/json: { schema: { $ref: '#/components/schemas/Booking' } } } }
        '401': { description: Unauthorized }
        '404': { description: Folio no encontrado }
  /api/v1/local-pms/{hotel_code}/bookings/{booking_id}/rooms/{reservation_id}:
    patch:
      summary: Modificar habitación/reserva
      parameters:
        - in: path
          name: hotel_code
          required: true
          schema: { type: string }
        - in: path
          name: booking_id
          required: true
          schema: { type: string }
        - in: path
          name: reservation_id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingRoom' }
      responses:
        '200': { description: OK }
        '401': { description: Unauthorized }
        '404': { description: No encontrado }
  /api/v1/local-pms/{hotel_code}/bookings/{booking_id}/guests:
    get:
      summary: Listar huéspedes de la reserva
      parameters:
        - in: path
          name: hotel_code
          required: true
          schema: { type: string }
        - in: path
          name: booking_id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Guest' }
    post:
      summary: Crear/actualizar huésped (idempotente por external_guest_id)
      parameters:
        - in: path
          name: hotel_code
          required: true
          schema: { type: string }
        - in: path
          name: booking_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Guest' }
      responses:
        '201': { description: Creado/Actualizado }
        '422': { description: Error de validación }
  /api/v1/local-pms/{hotel_code}/bookings/{booking_id}/guests/{guest_id}/board:
    post:
      summary: Marcar huésped como on board (check-in)
      parameters:
        - in: path
          name: hotel_code
          required: true
          schema: { type: string }
        - in: path
          name: booking_id
          required: true
          schema: { type: string }
        - in: path
          name: guest_id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: OK }
        '404': { description: Huésped no encontrado }

  /api/v1/local-pms/{hotel_code}/payments/methods:
    get:
      summary: Listado de métodos de pago disponibles
      parameters:
        - in: path
          name: hotel_code
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  methods:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        type: { type: string, description: "card|cash|transfer|other" }
                        currency: { type: string, example: EUR }
        '401': { description: Unauthorized }
  /api/v1/local-pms/{hotel_code}/payments/transactions:
    get:
      summary: Listar transacciones de pago
      parameters:
        - in: path
          name: hotel_code
          required: true
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: method_id
          schema: { type: string }
        - in: query
          name: booking_id
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        booking_id: { type: string }
                        method_id: { type: string }
                        amount: { type: number, format: float }
                        currency: { type: string, example: EUR }
                        status: { type: string, enum: [authorized, captured, refunded, voided, failed] }
                        created_at: { type: string, format: date-time }
        '401': { description: Unauthorized }
  /api/v1/local-pms/{hotel_code}/payments/charges:
    post:
      summary: Crear cargo (captura)
      description: "No soportado todavía por el PMS Local. Devuelve 501 not_supported."
      parameters:
        - in: path
          name: hotel_code
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [booking_id, method_id, amount]
              properties:
                booking_id: { type: string }
                method_id: { type: string }
                amount: { type: number, format: float }
                currency: { type: string, example: EUR }
                external_payment_id: { type: string, description: "Idempotency key from caller" }
                description: { type: string }
      responses:
        '501':
          description: Not supported
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: not_supported }
                  message: { type: string }
  /api/v1/local-pms/{hotel_code}/payments/refunds:
    post:
      summary: Solicitar reembolso
      description: "No soportado todavía por el PMS Local. Devuelve 501 not_supported."
      parameters:
        - in: path
          name: hotel_code
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transaction_id, amount]
              properties:
                transaction_id: { type: string }
                amount: { type: number, format: float }
                reason: { type: string }
      responses:
        '501':
          description: Not supported
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: not_supported }
                  message: { type: string }
  /api/v1/local-pms/{hotel_code}/bookings/{booking_id}/services:
    get:
      summary: Listar servicios/conceptos de una reserva
      parameters:
        - in: path
          name: hotel_code
          required: true
          schema: { type: string }
        - in: path
          name: booking_id
          required: true
          schema: { type: string }
        - in: query
          name: reservation_id
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  services:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        reservation_id: { type: integer }
                        name: { type: string }
                        quantity: { type: number }
                        unit_price: { type: number, format: float }
                        total_price: { type: number, format: float }
                        type: { type: integer, description: "1: Diario, 2: Extra, 3: Manual, 4: Descuento, 8: Oferta, 9: Operador" }
    post:
      summary: Añadir servicio/concepto a una reserva
      description: "No soportado todavía por el PMS Local. Devuelve 501 not_supported."
      parameters:
        - in: path
          name: hotel_code
          required: true
          schema: { type: string }
        - in: path
          name: booking_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reservation_id: { type: integer }
                name: { type: string }
                quantity: { type: number }
                unit_price: { type: number, format: float }
                total_price: { type: number, format: float }
                type: { type: integer }
      responses:
        '501':
          description: Not supported
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: not_supported }
                  message: { type: string }
  /api/v1/local-pms/{hotel_code}/bookings/{booking_id}/services/{service_id}:
    delete:
      summary: Eliminar servicio/concepto
      description: "No soportado todavía por el PMS Local. Devuelve 501 not_supported."
      parameters:
        - in: path
          name: hotel_code
          required: true
          schema: { type: string }
        - in: path
          name: booking_id
          required: true
          schema: { type: string }
        - in: path
          name: service_id
          required: true
          schema: { type: string }
      responses:
        '501':
          description: Not supported
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: not_supported }
                  message: { type: string }
